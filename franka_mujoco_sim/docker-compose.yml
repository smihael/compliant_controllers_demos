name: franka-mujoco-sim
services:
  franka-mujoco:
    build:
      context: ..
      dockerfile: franka_mujoco_sim/Dockerfile
      network: host
      args:
        BASE_IMAGE: "${FRANKA_BASE_IMAGE:-compliant-controllers:humble-desktop-full}"
    image: compliant-controllers:franka-mujoco-sim
    init: true
    network_mode: host
    ipc: host
    environment:
      ROS_DOMAIN_ID: "${ROS_DOMAIN_ID:-4}"
      MUJOCO_HEADLESS: "true"
      CONTROLLER_NAME: "${CONTROLLER_NAME:-cartesian_impedance_controller}"
    healthcheck:
      test: [CMD, /franka-mujoco-entrypoint.sh, ros2, run, franka_mujoco_sim, check_ready.py]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s
  demo:
    profiles: [demo]
    image: compliant-controllers:franka-mujoco-sim
    pull_policy: never
    init: true
    network_mode: host
    ipc: host
    environment:
      ROS_DOMAIN_ID: "${ROS_DOMAIN_ID:-4}"
    depends_on:
      franka-mujoco:
        condition: service_healthy
    command:
      - timeout
      - 30s
      - ros2
      - run
      - compliant_controllers
      - test_cartesian_command.py
      - --ros-args
      - -r
      - __ns:=/
      - -p
      - base_frame:=fr3_link0
      - -p
      - ee_frame:=fr3_link8
      - -p
      - dx:=0.005
      - -p
      - dy:=0.0
      - -p
      - dz:=0.0
      - -p
      - k_lin:=300.0
      - -p
      - k_rot:=20.0
  smoke-test:
    profiles: [test]
    image: compliant-controllers:franka-mujoco-sim
    pull_policy: never
    init: true
    network_mode: host
    ipc: host
    environment:
      ROS_DOMAIN_ID: "${ROS_DOMAIN_ID:-4}"
    depends_on:
      franka-mujoco:
        condition: service_healthy
    command: [timeout, 60s, ros2, run, franka_mujoco_sim, verify_motion.py]

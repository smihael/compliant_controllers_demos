services:
  controllers:
    build:
      context: .
      dockerfile: Dockerfile
      network: host
      args:
        BASE_IMAGE: "${FRANKA_BASE_IMAGE:-compliant-controllers:franka-real}"
    image: compliant-controllers:franka-onrobot
    user: "${USER_UID:-1000}:${USER_GID:-1000}"
    working_dir: /onrobot_ws
    network_mode: host
    ipc: host
    privileged: true
    init: true
    tty: true
    stdin_open: true
    restart: "no"
    cpuset: "${FRANKA_CPUSET:-20-27}"
    cap_add:
      - SYS_NICE
    ulimits:
      rtprio: 99
      rttime: -1
      memlock: ${FRANKA_MEMLOCK:-8428281856}
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - /dev:/dev
    environment:
      ROBOT_IP: "${ROBOT_IP:?Set ROBOT_IP in your local .env or shell}"
      EE_FRAME: "${EE_FRAME:-fr3_link8}"
      CONTROLLER_NAME: "${CONTROLLER_NAME:-cartesian_impedance_controller}"
      ROS_DISTRO: humble
      ROS_DOMAIN_ID: "${ROS_DOMAIN_ID:-11}"
      DISPLAY: "${DISPLAY:-:0}"
      QT_X11_NO_MITSHM: "1"
      HOME: /tmp/franka-home
      ROS_LOG_DIR: /tmp/franka-home/.ros/log
      ONROBOT_IP: "${ONROBOT_IP:?Set ONROBOT_IP in your local .env or shell}"
      ONROBOT_PORT: "${ONROBOT_PORT:-49152}"
      ONROBOT_SPEED: "${ONROBOT_SPEED:-10}"
      ONROBOT_FILTER: "${ONROBOT_FILTER:-4}"
      ONROBOT_SAMPLES_PER_REQUEST: "${ONROBOT_SAMPLES_PER_REQUEST:-10}"
      ONROBOT_BIAS_ON_START: "${ONROBOT_BIAS_ON_START:-false}"

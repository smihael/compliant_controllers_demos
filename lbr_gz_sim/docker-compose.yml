services:
  lbr-gazebo:
    build:
      context: .
      dockerfile: Dockerfile
      network: host
      args:
        BASE_IMAGE: "${LBR_BASE_IMAGE:-compliant-controllers:humble-desktop-full}"
        FRI_CLIENT_VERSION: "${FRI_CLIENT_VERSION:-1.15}"
    image: compliant-controllers:lbr-gz-sim
    container_name: compliant-demos-lbr-gazebo
    init: true
    network_mode: host
    ipc: host
    devices:
      - /dev/dri:/dev/dri
    environment:
      ROS_DOMAIN_ID: "${ROS_DOMAIN_ID:-2}"
      GZ_PARTITION: "${GZ_PARTITION:-compliant-lbr-sim}"
      IGN_PARTITION: "${GZ_PARTITION:-compliant-lbr-sim}"
      SHOW_GAZEBO_GUI: "${SHOW_GAZEBO_GUI:-true}"
      SHOW_RVIZ: "${SHOW_RVIZ:-false}"
      DISPLAY: "${DISPLAY:-:0}"
      LIBGL_ALWAYS_SOFTWARE: "1"
      MESA_LOADER_DRIVER_OVERRIDE: "llvmpipe"
      QT_X11_NO_MITSHM: "1"
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          bash -lc 'source /opt/ros/humble/setup.bash &&
          source /lbr_ws/install/setup.bash &&
          controllers=$$(ros2 control list_controllers -c /lbr/controller_manager 2>/dev/null) &&
          echo "$$controllers" | grep -q "joint_state_broadcaster.*active" &&
          echo "$$controllers" | grep -q "cartesian_impedance_controller.*active" &&
          timeout 3 ros2 topic echo --once /lbr/joint_states >/dev/null 2>&1'
      interval: 3s
      timeout: 8s
      retries: 20
      start_period: 10s

  demo:
    profiles: [demo]
    image: compliant-controllers:lbr-gz-sim
    pull_policy: never
    init: true
    network_mode: host
    ipc: host
    environment:
      ROS_DOMAIN_ID: "${ROS_DOMAIN_ID:-2}"
    depends_on:
      lbr-gazebo:
        condition: service_healthy
    command:
      - bash
      - -c
      - |
        source /opt/ros/humble/setup.bash &&
        source /lbr_ws/install/setup.bash &&
        exec timeout 30s ros2 run compliant_controllers test_cartesian_command.py \
          --ros-args -r __ns:=/lbr \
          -p base_frame:=lbr_link_0 -p ee_frame:=lbr_link_ee \
          -p dx:=0.005 -p dy:=0.0 -p dz:=0.0 \
          -p k_lin:=300.0 -p k_rot:=20.0

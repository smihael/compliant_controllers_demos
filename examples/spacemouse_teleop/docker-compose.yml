name: franka-spacemouse
services:
  simulation:
    image: ${FRANKA_SIM_IMAGE:-compliant-controllers:franka-gz-sim}
    pull_policy: never
    init: true
    network_mode: host
    ipc: host
    environment:
      ROS_DOMAIN_ID: "${ROS_DOMAIN_ID:-31}"
      GZ_PARTITION: franka-spacemouse
      IGN_PARTITION: franka-spacemouse
      SHOW_GAZEBO_GUI: "${SHOW_GAZEBO_GUI:-true}"
      SHOW_RVIZ: "false"
      DISPLAY: "${DISPLAY:-:0}"
      QT_X11_NO_MITSHM: "1"
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          bash -c 'source /opt/ros/humble/setup.bash &&
          source /controllers_ws/install/setup.bash &&
          ros2 control list_controllers -c /controller_manager 2>/dev/null |
          grep -q "cartesian_impedance_controller.*active" &&
          timeout 3 ros2 topic echo --once /joint_states >/dev/null 2>&1'
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 15s
  teleop:
    build:
      context: .
      network: host
      args:
        SIM_IMAGE: ${FRANKA_SIM_IMAGE:-compliant-controllers:franka-gz-sim}
    image: compliant-controllers:spacemouse-teleop
    init: true
    network_mode: host
    ipc: host
    environment:
      ROS_DOMAIN_ID: "${ROS_DOMAIN_ID:-31}"
    devices:
      - ${SPACEMOUSE_DEVICE:-/dev/hidraw3}:/dev/hidraw3
    depends_on:
      simulation:
        condition: service_healthy
    command:
      - ros2
      - launch
      - spacemouse_teleop
      - fr3_spacemouse_teleop.launch.py
      - namespace:=/
      - use_sim_time:=false
      - device_path:=/dev/hidraw3
      - operator_position_front:=${OPERATOR_POSITION_FRONT:-false}
      - linear_scale:=${LINEAR_SCALE:-0.08}
      - angular_scale:=${ANGULAR_SCALE:-0.35}
